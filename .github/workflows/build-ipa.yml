name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TabDemo-unsigned-ipa
          path: build/TabDemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish downloadable demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view demo-1.0 >/dev/null 2>&1; then
            gh release create demo-1.0 --target "$GITHUB_SHA" --title 'TabDemo 1.0 (unsigned)' --notes 'Minimal SwiftUI demo: Ana Sayfa, Ara, Profil. Unsigned device IPA; sign with your sideload tool before installing. iOS 16 or later.'
          fi
          gh release upload demo-1.0 build/TabDemo-unsigned.ipa --clobber
